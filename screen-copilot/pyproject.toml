[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-copilot"
version = "0.1.0"
description = "Claude-powered UI grounding (read what's under the mouse) and screen-region watching with notifications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["anthropic>=0.125", "mss>=9.0", "pillow>=10.0", "pynput>=1.7"]

[project.scripts]
screen-copilot = "screen_copilot.__main__:main"

[tool.setuptools]
packages = ["screen_copilot"]
